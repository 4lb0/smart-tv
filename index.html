<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart TV Home</title>
  <style>
    :root {
      --size: 18vw;
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e6eef8;
    }

    .wrap {
      display: flex;
      gap: 5vw;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap
    }

    a.icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--size);
      height: var(--size);
      border-radius: 12px;
      background: transparent;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease
    }

    a.icon img {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain
    }

    a.icon:focus {
      outline: 3px solid #7dd3fc;
      outline-offset: 4px
    }

    a.icon:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 10px 20px rgba(2, 6, 23, 0.6)
    }

    .caption {
      width: 100%;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      opacity: .9
    }

    @media (max-width:420px) {
      :root {
        --size: 72px
      }

      ;

      .wrap {
        gap: 18px
      }
    }

  </style>
</head>

<body>
  <main>
    <div class="wrap">
      <a class="icon" href="https://www.disneyplus.com" rel="noopener noreferrer" title="Disney+">
        <img src="assets/disneyplus.png" alt="Disney+" />
      </a>

      <a class="icon" href="https://www.youtube.com" rel="noopener noreferrer" title="YouTube">
        <img src="assets/youtube.png" alt="YouTube" />
      </a>

      <a class="icon" href="https://pelisgo.online/" rel="noopener noreferrer" title="Pelisgo">
        <img src="assets/pelisgo.png" alt="Pelisgo" />
      </a>

      <a class="icon" href="https://0123movie.org/" rel="noopener noreferrer" title="0123Movie">
        <img src="assets/0123movie.png" alt="0123Movie" />
      </a>
    </div>
  </main>
</body>

</html>
